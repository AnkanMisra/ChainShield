# Minimal nginx site config for the ChainShield Astro static bundle.
#
# - Listens on port 80 inside the container (compose maps host 4321 -> 80).
# - Serves /usr/share/nginx/html/ as the document root.
# - Falls back to /index.html for unknown paths so the single-page Astro
#   app handles routing client-side without producing a hard 404.
# - Long-cache the immutable /assets/* fingerprinted output, no-cache the
#   index so deploys are picked up immediately on browser refresh.
# - Compresses text payloads to keep over-the-wire size small on free-tier
#   bandwidth.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text payloads. Astro ships JS/CSS as text; HTML is small.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Astro emits content-hashed filenames under /assets — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The HTML shell must always re-fetch so deploys are seen immediately.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Default: try the file, then directory, then fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tiny health endpoint for Docker / Compose / Render health checks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
